services:

  api1:
    build: .
    container_name: api1

  api2:
    build: .
    container_name: api2

  api3:
    build: .
    container_name: api3

  nginx:
    image: nginx:latest
    container_name: nginx-lb

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - api1
      - api2
      - api3
